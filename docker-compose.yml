version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: local Qwen 3 model server. Comment this whole service out
  # (and the `depends_on` above) if you'd rather run Ollama on the host
  # machine or point LLM_PROVIDER at a hosted OpenAI-compatible API instead.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # First run: docker compose exec ollama ollama pull qwen3:8b

volumes:
  ollama_models:
